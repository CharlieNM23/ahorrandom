<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.webmanifest"><title>Ahorrandom</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111}body{margin:0;background:#f5f5f7;min-height:100vh}main{max-width:520px;margin:auto;padding:24px 18px 60px}.card{background:white;border-radius:24px;padding:22px;margin:14px 0;box-shadow:0 8px 28px rgba(0,0,0,.07)}h1{font-size:34px;margin:10px 0 0}.sub{color:#666;margin-top:5px}.amount{font-size:58px;font-weight:800;text-align:center;margin:18px 0}button{width:100%;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:700;margin:6px 0}.primary{background:#111;color:#fff}.secondary{background:#e9e9ed}.danger{background:#fff0f0;color:#a00}.row{display:flex;gap:10px}.row button{flex:1}progress{width:100%;height:18px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f5f5f7;border-radius:16px;padding:14px}.big{font-size:22px;font-weight:800}.muted{color:#777;font-size:13px}ul{padding-left:20px;max-height:220px;overflow:auto}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#eee;font-size:13px;font-weight:700}</style></head>
<body><main><h1>Ahorrandom 💰🎲</h1><div class="sub">Reto $10,000 · 15 sep → 16 dic 2026</div>
<section class="card"><span class="badge" id="dayType">Día normal</span><div class="amount" id="amount">—</div><button class="primary" id="draw">🎲 Sortear ahorro de hoy</button><div class="row"><button class="secondary" id="saved" disabled>✅ Ya lo ahorré</button><button class="danger" id="skip" disabled>😅 Hoy no puedo</button></div><p class="muted" id="msg">El monto queda bloqueado hasta que lo confirmes o lo omitas.</p></section>
<section class="card"><div class="stats"><div class="stat"><div class="muted">Ahorrado</div><div class="big" id="total">$0</div></div><div class="stat"><div class="muted">Falta</div><div class="big" id="remaining">$10,000</div></div><div class="stat"><div class="muted">Avance</div><div class="big" id="pct">0%</div></div><div class="stat"><div class="muted">Días restantes</div><div class="big" id="days">—</div></div></div><progress id="progress" max="100" value="0"></progress></section>
<section class="card"><b>Historial</b><ul id="history"><li class="muted">Todavía no hay movimientos.</li></ul><button class="secondary" id="reset">Reiniciar datos</button></section></main>
<script>
const GOAL=10000,START=new Date(2026,8,15),END=new Date(2026,11,16),normal=[40,50,60,70,80,90],payday=[600,620,640,660,680,700],$=id=>document.getElementById(id);
let state=JSON.parse(localStorage.getItem("ahorrandom")||'{"total":0,"history":[],"pending":null}');
function key(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function isPayday(d){let x=d.getDate(),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return x===15||x===last}
function inRange(d){let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return x>=START&&x<=END}
function money(n){return n.toLocaleString("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:0})}
function save(){localStorage.setItem("ahorrandom",JSON.stringify(state));render()}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function draw(){let today=key();if(!inRange(new Date()))return alert("El reto funciona del 15 de septiembre al 16 de diciembre de 2026.");if(state.pending&&state.pending.date===today)return;let p=isPayday(new Date());state.pending={date:today,amount:pick(p?payday:normal),payday:p};save()}
function confirmSaved(){if(!state.pending)return;state.total+=state.pending.amount;state.history.unshift({...state.pending,status:"Ahorrado"});state.pending=null;save()}
function skip(){if(!state.pending)return;state.history.unshift({...state.pending,status:"Omitido"});state.pending=null;save()}
function render(){let now=new Date(),p=Math.min(100,state.total/GOAL*100),pending=state.pending&&state.pending.date===key()?state.pending:null;$("amount").textContent=pending?money(pending.amount):"—";$("dayType").textContent=isPayday(now)?"💰 Día de quincena":"Día normal";$("draw").disabled=!!pending;$("saved").disabled=!pending;$("skip").disabled=!pending;$("total").textContent=money(state.total);$("remaining").textContent=money(Math.max(0,GOAL-state.total));$("pct").textContent=Math.round(p)+"%";$("progress").value=p;$("days").textContent=now>END?"0":Math.max(0,Math.ceil((END-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000)+1);$("history").innerHTML=state.history.length?state.history.map(x=>`<li>${x.date}: ${money(x.amount)} — ${x.status}${x.payday?" 💰":""}</li>`).join(""):'<li class="muted">Todavía no hay movimientos.</li>';if(state.total>=GOAL)$("msg").textContent="🎉 ¡Meta alcanzada! Llegaste a $10,000."}
$("draw").onclick=draw;$("saved").onclick=confirmSaved;$("skip").onclick=skip;$("reset").onclick=()=>{if(confirm("¿Borrar todo el progreso?")){state={total:0,history:[],pending:null};save()}};render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
